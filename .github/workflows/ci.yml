name: PowerShell validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or later is required.' }
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSResourceRepository -PSGallery -ErrorAction Stop
          }
          Install-PSResource Pester -Version 6.2.0 -Repository PSGallery -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
          Import-Module Pester -RequiredVersion 6.2.0 -Force -ErrorAction Stop
          Write-Host "Selected runtime: PowerShell $($PSVersionTable.PSVersion); Pester $((Get-Module Pester).Version)"
      - name: Validate module and run offline tests
        shell: pwsh
        run: ./scripts/Test-TokenForge.ps1
