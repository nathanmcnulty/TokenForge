name: PowerShell validation
on:
  workflow_dispatch:
    inputs:
      publication_probe:
        description: 'Synthetic public artifact compatibility probe; no collection or publication'
        type: boolean
        default: false
      publication_phase:
        description: 'Public fixture diagnostic or signed premerge compatibility proof'
        type: choice
        options: [artifact, seal]
        default: artifact
permissions:
  contents: read
jobs:
  test:
    if: ${{ !inputs.publication_probe }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.6') { throw 'PowerShell 7.6 or later is required.' }
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSResourceRepository -PSGallery -ErrorAction Stop
          }
          Install-PSResource Pester -Version 6.2.0 -Repository PSGallery -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
          Import-Module Pester -RequiredVersion 6.2.0 -Force -ErrorAction Stop
          Write-Host "Selected runtime: PowerShell $($PSVersionTable.PSVersion); Pester $((Get-Module Pester).Version)"
      - name: Validate module and run offline tests
        shell: pwsh
        run: ./scripts/Test-TokenForge.ps1
  publication_probe:
    if: ${{ inputs.publication_probe && github.repository == 'nathanmcnulty/TokenForge' && github.ref == 'refs/heads/codex/issue113-publication-acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record existing tools and create only the public synthetic fixture
        env:
          TF_CANARY_DIRECTORY: ${{ runner.temp }}/tokenforge-public-canary
        run: |
          python3 --version
          if command -v gh >/dev/null; then
            gh --version
            sha256sum "$(command -v gh)"
            if gh attestation verify --help >/dev/null 2>&1; then
              echo 'AttestationVerifierAvailable=true'
            else
              echo 'AttestationVerifierAvailable=false'
            fi
          else
            echo 'GitHubCliAvailable=false'
          fi
          python3 -I scripts/New-TokenForgePublicCanary.py "$TF_CANARY_DIRECTORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: candidate
        with:
          name: tokenforge-synthetic-public-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokenforge-public-canary/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          overwrite: false
  publication_seal:
    needs: publication_probe
    if: ${{ inputs.publication_probe && inputs.publication_phase == 'seal' && github.repository == 'nathanmcnulty/TokenForge' && github.ref == 'refs/heads/codex/issue113-publication-acceptance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate actual service ZIP bytes against the public fixture
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          TF_ARTIFACT_ID: ${{ needs.publication_probe.outputs.artifact_id }}
          TF_EVIDENCE: ${{ runner.temp }}/tokenforge-synthetic-seal
        run: python3 -I scripts/Verify-TokenForgePublicCanary.py "$TF_ARTIFACT_ID" "$TF_EVIDENCE"
      - name: Attest only the validated original service archive
        id: attest
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: ${{ runner.temp }}/tokenforge-synthetic-seal/candidate.zip
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Verify genuine signature and exact source bindings; reject tampered bytes
        env:
          TF_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TF_EVIDENCE: ${{ runner.temp }}/tokenforge-synthetic-seal
        run: python3 -I scripts/Verify-TokenForgeCanaryAttestation.py "$TF_EVIDENCE" "$TF_BUNDLE"
      - name: Preserve only public synthetic proof artifacts
        if: ${{ always() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tokenforge-synthetic-sealing-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenforge-synthetic-seal/candidate.zip
            ${{ runner.temp }}/tokenforge-synthetic-seal/subject.json
            ${{ runner.temp }}/tokenforge-synthetic-seal/bundle.jsonl
            ${{ runner.temp }}/tokenforge-synthetic-seal/verification.json
            ${{ runner.temp }}/tokenforge-synthetic-seal/verification.log
            ${{ runner.temp }}/tokenforge-synthetic-seal/verification-checks.json
            ${{ runner.temp }}/tokenforge-synthetic-seal/tampered-verification.log
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
