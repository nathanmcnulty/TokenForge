name: Native CLI validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies and test the shared core
        shell: pwsh
        run: |
          dotnet restore native/TokenForge.Core.Tests --locked-mode
          if ($LASTEXITCODE) { throw 'Restore failed.' }
          dotnet run --project native/TokenForge.Core.Tests --no-restore
          if ($LASTEXITCODE) { throw 'Core tests failed.' }
      - name: Publish the native executable
        shell: pwsh
        run: ./scripts/Build-TokenForgeNative.ps1 -Runtime 'linux-x64'
      - name: Test Linux Secret Service in an isolated session
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring libsecret-1-0 dbus xdg-utils python3
          test -x /usr/bin/xdg-open && test -x /usr/bin/python3
          dbus-run-session -- bash scripts/Test-TokenForgeSecretService.sh pwsh -NoProfile -File scripts/Test-TokenForgeOperatingSystemVault.ps1 -NativeExecutablePath "$PWD/dist/native/linux-x64/tokenforge"
      - name: Validate SQLite scope, flow, and catalog adapters with synthetic evidence
        shell: pwsh
        run: |
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSResourceRepository -PSGallery -ErrorAction Stop
          }
          Install-PSResource Pester -Version 6.2.0 -Repository PSGallery -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
          Import-Module Pester -RequiredVersion 6.2.0 -Force -ErrorAction Stop
          $env:TOKENFORGE_TEST_NATIVE = (Resolve-Path './dist/native/linux-x64/tokenforge').Path
          Import-Module (Join-Path (Split-Path $env:TOKENFORGE_TEST_NATIVE -Parent) src/TokenForge/TokenForge.psd1) -Force
          Remove-Module TokenForge # Keep compiled credential types loaded while tests import their source module.
          $result = Invoke-Pester ./tests/PasskeyAdapter.Tests.ps1,./tests/NativePasskeyRecovery.Tests.ps1,./tests/ResearchCoverage.Tests.ps1,./tests/SqliteFlow.Tests.ps1,./tests/SqliteCatalog.Tests.ps1,./tests/SqliteScope.Tests.ps1,./tests/ResearchCohort.Tests.ps1,./tests/WeeklyCli.Tests.ps1,./tests/NativeWeekly.Tests.ps1,./tests/NativeOAuth.Tests.ps1,./tests/NativeMaintenanceBackup.Tests.ps1,./tests/NativeMaintenanceSnapshot.Tests.ps1,./tests/NativeProfiles.Tests.ps1,./tests/NativeProfileTokens.Tests.ps1,./tests/CredentialBootstrap.Tests.ps1,./tests/Profiles.Tests.ps1,./tests/NativeScopePlanning.Tests.ps1,./tests/ScopeCandidates.Tests.ps1,./tests/Assessment.Tests.ps1,./tests/ScopedToken.Tests.ps1,./tests/Browser.Tests.ps1 -PassThru -Output Detailed
          $expectedPasses = 340 # 343 discovered cases minus three Linux platform skips.
          if ($result.FailedCount -or $result.FailedContainersCount -or $result.PassedCount -ne $expectedPasses) { throw 'Native metadata and weekly CLI tests failed.' }
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $exe = './dist/native/linux-x64/tokenforge'
          & $exe help
          if ($LASTEXITCODE) { throw 'CLI help failed.' }
          $root = Join-Path ([IO.Path]::GetTempPath()) ('TokenForge-native-cli-' + [guid]::NewGuid())
          try {
            & $exe profile create --profile smoke --tenant example.test --root $root --json
            if ($LASTEXITCODE) { throw 'CLI create failed.' }
            & $exe status --profile smoke --root $root --json
            if ($LASTEXITCODE) { throw 'CLI status failed.' }
            $snapshot = Join-Path $root 'maintenance snapshot.sealed'
            $cipher = [byte[]]::new(32); $cipher[0] = 1
            [IO.File]::WriteAllBytes($snapshot, $cipher)
            if (-not $IsWindows) { [IO.File]::SetUnixFileMode($snapshot, [IO.UnixFileMode]384) }
            $backupJson = & $exe research backup --snapshot-path $snapshot --backup-directory (Join-Path $root 'backup copies') --json
            if ($LASTEXITCODE) { throw 'CLI ciphertext backup failed.' }
            $backup = $backupJson | ConvertFrom-Json
            if (-not $backup.Saved -or $backup.Authenticated -or $backup.Bytes -ne 32) { throw 'CLI backup status failed.' }
            if ((Get-FileHash $backup.BackupPath).Hash -cne (Get-FileHash $snapshot).Hash) { throw 'CLI backup byte identity failed.' }
            $state = Join-Path $root 'research'
            $null = New-Item -ItemType Directory $state
            if (-not $IsWindows) { [IO.File]::SetUnixFileMode($state, [IO.UnixFileMode]448) }
            @{Format='TokenForgeApplicationMetadata';SchemaVersion=1;CreatedAt=[DateTimeOffset]::UtcNow.ToString('o');UpdatedAt=[DateTimeOffset]::UtcNow.ToString('o');Applications=@{};Origins=@{};Runs=@()} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $state applications.json)
            if (-not $IsWindows) { [IO.File]::SetUnixFileMode((Join-Path $state applications.json), [IO.UnixFileMode]384) }
            & $exe research report --state-path $state --summary-only --json
            if ($LASTEXITCODE) { throw 'CLI research report failed.' }
            & $exe research export-flows --state-path $state --export-path (Join-Path $root anonymous-flows.json) --json
            if ($LASTEXITCODE) { throw 'CLI research export failed.' }
          } finally { if (Test-Path $root) { Remove-Item $root -Recurse -Force } }
