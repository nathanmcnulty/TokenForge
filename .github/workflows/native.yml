name: Native CLI validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.401
      - name: Restore locked dependencies and test the shared core
        shell: pwsh
        run: |
          dotnet restore native/TokenForge.Core.Tests --locked-mode
          if ($LASTEXITCODE) { throw 'Restore failed.' }
          dotnet run --project native/TokenForge.Core.Tests --no-restore
          if ($LASTEXITCODE) { throw 'Core tests failed.' }
      - name: Test Windows Credential Manager with disposable synthetic keys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Test-TokenForgeOperatingSystemVault.ps1
      - name: Test Linux Secret Service in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring libsecret-1-0 dbus
          dbus-run-session -- bash scripts/Test-TokenForgeSecretService.sh pwsh -NoProfile -File scripts/Test-TokenForgeOperatingSystemVault.ps1
      - name: Publish the native executable
        shell: pwsh
        run: ./scripts/Build-TokenForgeNative.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Validate SQLite scope, flow, and catalog adapters with synthetic evidence
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          $env:TOKENFORGE_TEST_NATIVE = (Resolve-Path (Join-Path './dist/native/${{ matrix.runtime }}' $(if ($IsWindows) { 'tokenforge.exe' } else { 'tokenforge' }))).Path
          $result = Invoke-Pester ./tests/SqliteFlow.Tests.ps1,./tests/SqliteCatalog.Tests.ps1,./tests/SqliteScope.Tests.ps1,./tests/ResearchCohort.Tests.ps1 -PassThru -Output Detailed
          if ($result.FailedCount -or $result.PassedCount -ne 22) { throw 'SQLite metadata adapter tests failed.' }
      - name: Smoke-test packaged CLI
        shell: pwsh
        run: |
          $exe = Join-Path './dist/native/${{ matrix.runtime }}' $(if ($IsWindows) { 'tokenforge.exe' } else { 'tokenforge' })
          & $exe help
          if ($LASTEXITCODE) { throw 'CLI help failed.' }
          $root = Join-Path ([IO.Path]::GetTempPath()) ('TokenForge-native-cli-' + [guid]::NewGuid())
          if ($IsMacOS -and $root.StartsWith('/var/')) { $root = '/private' + $root }
          try {
            & $exe profile create --profile smoke --tenant example.test --root $root --json
            if ($LASTEXITCODE) { throw 'CLI create failed.' }
            & $exe status --profile smoke --root $root --json
            if ($LASTEXITCODE) { throw 'CLI status failed.' }
            $state = Join-Path $root 'research'
            $null = New-Item -ItemType Directory $state
            if (-not $IsWindows) { [IO.File]::SetUnixFileMode($state, [IO.UnixFileMode]448) }
            @{Format='TokenForgeApplicationMetadata';SchemaVersion=1;CreatedAt=[DateTimeOffset]::UtcNow.ToString('o');UpdatedAt=[DateTimeOffset]::UtcNow.ToString('o');Applications=@{};Origins=@{};Runs=@()} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $state applications.json)
            & $exe research report --state-path $state --summary-only --json
            if ($LASTEXITCODE) { throw 'CLI research report failed.' }
            & $exe research export-flows --state-path $state --export-path (Join-Path $root anonymous-flows.json) --json
            if ($LASTEXITCODE) { throw 'CLI research export failed.' }
          } finally { if (Test-Path $root) { Remove-Item $root -Recurse -Force } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        # Validation still runs on PRs; publish packages only from the trusted main push.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tokenforge-${{ matrix.runtime }}
          path: dist/native/${{ matrix.runtime }}/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  artifact-retention:
    concurrency:
      group: native-artifact-retention
      cancel-in-progress: false
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keep latest main packages and remove superseded native builds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Remove-TokenForgeNativeArtifacts.ps1 -Repository $env:GITHUB_REPOSITORY -CurrentRunId ([long]$env:GITHUB_RUN_ID) -Confirm:$false
