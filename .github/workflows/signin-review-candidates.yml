# Inert example. Separate review is required before running even this claim proof.
name: Verify sign-in audit OIDC claims
"on":
  workflow_dispatch:
permissions: {}

jobs:
  audit-claim-proof:
    if: >-
      github.repository == 'nathanmcnulty/TokenForge' &&
      github.repository_id == '1402673320' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: entra-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check immutable OIDC claims
        run: python3 -B examples/signin-review/oidc_claim_check.py
