name: TokenForge trusted reusable sealer (quarantined)
on:
  workflow_call:
    inputs:
      artifact-id:
        description: Original seven-file candidate artifact ID from this caller run
        required: true
        type: string
permissions: {}
env:
  # Implementation and workflow are separate immutable commits; never caller input.
  TF_SEALER_CODE_COMMIT: @TOKENFORGE_CODE_COMMIT@
concurrency:
  group: tokenforge-sealer-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  seal:
    # Deliberate quarantine. Activation, caller wiring and Actions need separate approval.
    if: @TOKENFORGE_SEAL_GUARD@
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Load only the reviewed implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nathanmcnulty/TokenForge
          ref: ${{ env.TF_SEALER_CODE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Validate original artifact bytes against trusted caller context
        shell: pwsh
        env:
          TF_ARTIFACT_ID: ${{ inputs.artifact-id }}
          TF_REPOSITORY: ${{ github.repository }}
          TF_REPOSITORY_ID: ${{ github.repository_id }}
          TF_SOURCE_COMMIT: ${{ github.sha }}
          TF_RUN_ID: ${{ github.run_id }}
          TF_RUN_ATTEMPT: ${{ github.run_attempt }}
          TF_REF: ${{ github.ref }}
          TF_EVENT: ${{ github.event_name }}
          TF_WORKFLOW_REF: ${{ github.workflow_ref }}
          TF_READ_TOKEN: ${{ github.token }}
        run: ./scripts/Invoke-TokenForgeSealer.ps1 -ArtifactId $env:TF_ARTIFACT_ID
      - name: Sign exactly the independently validated original ZIP
        id: attest
        uses: actions/attest-build-provenance@9d57eef8c06cd9d6b433effeeb7a6a77b3ff94ad
        with:
          subject-path: ${{ runner.temp }}/tokenforge-sealed/candidate.zip
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Retain original bytes, validation receipt and signed bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tokenforge-sealed-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/tokenforge-sealed/candidate.zip
            ${{ runner.temp }}/tokenforge-sealed/subject.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false
