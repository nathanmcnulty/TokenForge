# Reference copy of the manual sign-in review workflow.
name: Review sign-in application candidates
"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Run sign-in review, combined review, or the one-time directory audit validation
        type: choice
        default: sign-in
        options:
          - sign-in
          - directory-validation
          - sign-in-and-directory
permissions: {}
concurrency:
  group: tokenforge-signin-review
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      (inputs.mode == 'sign-in' || inputs.mode == 'sign-in-and-directory') &&
      github.repository == 'nathanmcnulty/TokenForge' &&
      github.repository_id == '1402673320' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: entra-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    outputs:
      ciphertext: ${{ steps.collect.outputs.ciphertext }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash examples/signin-review/install-proof-age.sh
      - id: collect
        name: Read requested Graph audit windows
        env:
          TF_REVIEW_MODE: ${{ inputs.mode }}
          TF_AUDIT_CLIENT_ID: ${{ secrets.TOKENFORGE_AUDIT_CLIENT_ID }}
          TF_AUDIT_TENANT_ID: ${{ secrets.TOKENFORGE_AUDIT_TENANT_ID }}
          TF_HANDOFF_RECIPIENT: ${{ vars.TOKENFORGE_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          case "$TF_REVIEW_MODE" in
            sign-in)
              git fetch --quiet --no-tags --depth=1 https://github.com/nathanmcnulty/TokenForge.git ec3d72d75241c69bb9ca46528b32a1e7fd2a0b62
              python3 -B examples/signin-review/review_ci.py collect
              ;;
            sign-in-and-directory)
              git fetch --quiet --no-tags --depth=1 https://github.com/nathanmcnulty/TokenForge.git refs/heads/discovery-data
              TF_CATALOG_TIP="$(git rev-parse --verify FETCH_HEAD)" python3 -B examples/signin-review/review_ci.py collect-directory
              ;;
            *) exit 2 ;;
          esac

  issue:
    needs: collect
    if: >-
      needs.collect.result == 'success' &&
      (inputs.mode == 'sign-in' || inputs.mode == 'sign-in-and-directory') &&
      github.repository == 'nathanmcnulty/TokenForge' &&
      github.repository_id == '1402673320' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: entra-audit-issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Read exact public workflow source and catalog tip
        id: source
        env:
          TF_REVIEW_MODE: ${{ inputs.mode }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/tokenforge-public-source"
          cd "$RUNNER_TEMP/tokenforge-public-source"
          git init --quiet
          git -c credential.helper= fetch --quiet --no-tags --depth=1 https://github.com/nathanmcnulty/TokenForge.git "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          bash examples/signin-review/install-proof-age.sh
          if [[ "$TF_REVIEW_MODE" == 'sign-in-and-directory' ]]; then
            catalog_tip="$(git -c credential.helper= ls-remote --exit-code https://github.com/nathanmcnulty/TokenForge.git refs/heads/discovery-data)"
            [[ "$catalog_tip" =~ ^([0-9a-f]{40})$'\t'refs/heads/discovery-data$ ]]
            printf 'catalog-tip=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the configured review queue
        env:
          TF_REVIEW_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          TF_CATALOG_TIP: ${{ steps.source.outputs.catalog-tip }}
          TF_HANDOFF_CIPHERTEXT: ${{ needs.collect.outputs.ciphertext }}
          TF_HANDOFF_IDENTITY: ${{ secrets.TOKENFORGE_AGE_IDENTITY }}
          TF_REVIEW_ISSUE: ${{ vars.TOKENFORGE_SIGNIN_REVIEW_ISSUE }}
          TF_REVIEW_ISSUE_NODE: ${{ vars.TOKENFORGE_SIGNIN_REVIEW_ISSUE_NODE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tokenforge-public-source"
          case "$TF_REVIEW_MODE" in
            sign-in) python3 -B examples/signin-review/review_ci.py issue ;;
            sign-in-and-directory) python3 -B examples/signin-review/review_ci.py issue-directory ;;
            *) exit 2 ;;
          esac

  directory_validation:
    if: >-
      inputs.mode == 'directory-validation' &&
      github.repository == 'nathanmcnulty/TokenForge' &&
      github.repository_id == '1402673320' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    environment: entra-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the bounded directory audit window
        env:
          TF_VALIDATION_MODE: ${{ inputs.mode }}
          TF_AUDIT_CLIENT_ID: ${{ secrets.TOKENFORGE_AUDIT_CLIENT_ID }}
          TF_AUDIT_TENANT_ID: ${{ secrets.TOKENFORGE_AUDIT_TENANT_ID }}
        run: |
          set -euo pipefail
          umask 077
          git fetch --quiet --no-tags --depth=1 https://github.com/nathanmcnulty/TokenForge.git ec3d72d75241c69bb9ca46528b32a1e7fd2a0b62
          python3 -B examples/signin-review/validate_directory.py
