name: Refresh application metadata
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      workers:
        description: 'Independent workers (1-4)'
        default: '4'
        required: true
      mode:
        description: 'Separate weekly sampling or bounded deeper research'
        type: choice
        options: [Auto, Shallow, Deep]
        default: Auto
      app_ids:
        description: 'Optional comma-separated published IDs for a new deep recipe'
        default: ''
      validation_only:
        description: 'Isolated hosted proof: Deep mode, 1-4 explicit IDs, no catalog branch update'
        type: boolean
        default: false
      retry_exhausted:
        description: 'Allow up to ten attempts instead of three'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: discovery-data-writer
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Load public data branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $data=Join-Path $env:RUNNER_TEMP 'discovery-data'
          New-Item -ItemType Directory $data | Out-Null
          Set-Location $data
          git init --quiet
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          gh api "repos/$env:GITHUB_REPOSITORY/branches/discovery-data" --silent 2>$null
          if($LASTEXITCODE -eq 0){
            git fetch --depth=1 origin discovery-data
            if($LASTEXITCODE -ne 0){throw 'Data fetch failed.'}
            git checkout --quiet -B discovery-data FETCH_HEAD
          }else{
            gh api "repos/$env:GITHUB_REPOSITORY" --silent
            if($LASTEXITCODE -ne 0){throw 'Repository access failed.'}
            git checkout --quiet --orphan discovery-data
          }
      - name: Freeze membership and select pending or failed work
        id: plan
        shell: pwsh
        env:
          WORKERS: ${{ inputs.workers || '4' }}
          MODE: ${{ inputs.mode || 'Auto' }}
          APP_IDS: ${{ inputs.app_ids }}
          RETRY_EXHAUSTED: ${{ inputs.retry_exhausted }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          $options=@{}
          if($env:APP_IDS){$options.AppId=@($env:APP_IDS.Split(',')|ForEach-Object {[guid]$_.Trim()})}
          $validation=$env:VALIDATION_ONLY -eq 'true'
          if($validation){
            if($env:MODE -cne 'Deep' -or -not $options.AppId -or $options.AppId.Count -gt 4){throw 'Validation requires Deep mode and 1-4 explicit app IDs.'}
            $source="$env:RUNNER_TEMP/discovery-data"
            $data="$env:RUNNER_TEMP/validation-data"
            New-Item -ItemType Directory $data | Out-Null
            if(Test-Path "$source/applications.json"){Copy-Item "$source/applications.json" "$data/applications.json"}
            git -C $data init --quiet
            git -C $data -c user.name=Validation -c user.email=validation@example.invalid commit --quiet --allow-empty -m 'Isolated validation seed'
            if($LASTEXITCODE -ne 0){throw 'Validation seed failed.'}
            $options.ValidationOnly=$true
          }else{$data="$env:RUNNER_TEMP/discovery-data"}
          ./scripts/Invoke-TokenForgeWeeklyCi.ps1 -Action Prepare -DataPath $data -BundlePath "$env:RUNNER_TEMP/plan" -Workers ([int]$env:WORKERS) -Mode $env:MODE -RetryExhausted:($env:RETRY_EXHAUSTED -eq 'true') @options
          if($validation){Remove-Item -LiteralPath $source -Recurse -Force;Move-Item -LiteralPath $data -Destination $source}
      - name: Upload public recipe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-plan
          path: |
            ${{ runner.temp }}/plan/state.json
            ${{ runner.temp }}/plan/request.json
          overwrite: true
          retention-days: 8
          if-no-files-found: error
      - name: Upload prepared public data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-data
          path: |
            ${{ runner.temp }}/discovery-data/applications.json
            ${{ runner.temp }}/discovery-data/weekly-*.json
            ${{ runner.temp }}/discovery-data/coverage-*.json
            ${{ runner.temp }}/discovery-data/reports/*.json
            ${{ runner.temp }}/discovery-data/scopes/*.json
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  worker:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'True'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weekly-plan
          path: ${{ runner.temp }}/plan
      - name: Prepare isolated outputs and recover encrypted checkpoints
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ matrix.plan }}
          INDEX: ${{ matrix.index }}
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/result","$env:RUNNER_TEMP/private" | Out-Null
          ./scripts/Get-TokenForgeCiCheckpoint.ps1 -PlanId $env:PLAN -Index ([int]$env:INDEX) -OutputPath "$env:RUNNER_TEMP/private/prior.sealed"
      - name: Sign in independently with Nora's software passkey
        id: login
        uses: nathanmcnulty/action-passkey-login@d443b0d18fe3a9cf162811bd67a67b9dec77a7e7
        with:
          confirm-application: 'true'
          expected-client-id: '04b07795-8ddb-461a-bbee-02f9e1bf7b46'
          credential-id: ${{ secrets.NORA_PASSKEY_CREDENTIAL_ID }}
          user-handle: ${{ secrets.NORA_PASSKEY_USER_HANDLE }}
          private-key: ${{ secrets.NORA_PASSKEY_PRIVATE_KEY }}
          user-principal-name: ${{ secrets.NORA_PASSKEY_UPN }}
      - name: Assess frozen batch using existing authorization
        shell: pwsh
        env:
          TOKENFORGE_ESTS_COOKIE: ${{ steps.login.outputs.auth-cookie }}
          TOKENFORGE_COOKIE_NAME: ${{ steps.login.outputs.cookie-name }}
          TOKENFORGE_TENANT_FINGERPRINT: ${{ secrets.NORA_TENANT_FINGERPRINT }}
          TOKENFORGE_PRINCIPAL_FINGERPRINT: ${{ secrets.NORA_PRINCIPAL_FINGERPRINT }}
          TOKENFORGE_CHECKPOINT_KEY: ${{ secrets.TOKENFORGE_CHECKPOINT_KEY }}
          AUTHENTICATED: ${{ steps.login.outputs.authenticated }}
          INDEX: ${{ matrix.index }}
        run: |
          if($env:AUTHENTICATED -ne 'true' -or -not $env:TOKENFORGE_CHECKPOINT_KEY){throw 'Verified authentication and a checkpoint key are required.'}
          ./scripts/Invoke-TokenForgeCiDiscovery.ps1 -DataPath "$env:RUNNER_TEMP/anonymous" -WeeklyStatePath "$env:RUNNER_TEMP/plan/state.json" -ChunkIndex ([int]$env:INDEX) -ReceiptPath "$env:RUNNER_TEMP/result/receipt.json" -CheckpointPath "$env:RUNNER_TEMP/private/checkpoint.sealed" -CheckpointInputPath "$env:RUNNER_TEMP/private/prior.sealed"
          Copy-Item (Join-Path "$env:RUNNER_TEMP/anonymous/scopes" ('chunk-{0:D4}.json' -f [int]$env:INDEX)) "$env:RUNNER_TEMP/result/scopes.json"
      - name: Verify isolated encrypted resume does not repeat completed cells
        if: inputs.validation_only
        shell: pwsh
        env:
          TOKENFORGE_ESTS_COOKIE: ${{ steps.login.outputs.auth-cookie }}
          TOKENFORGE_COOKIE_NAME: ${{ steps.login.outputs.cookie-name }}
          TOKENFORGE_TENANT_FINGERPRINT: ${{ secrets.NORA_TENANT_FINGERPRINT }}
          TOKENFORGE_PRINCIPAL_FINGERPRINT: ${{ secrets.NORA_PRINCIPAL_FINGERPRINT }}
          TOKENFORGE_CHECKPOINT_KEY: ${{ secrets.TOKENFORGE_CHECKPOINT_KEY }}
          INDEX: ${{ matrix.index }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/TokenForgeCiState.ps1
          $state=Get-Content "$env:RUNNER_TEMP/plan/state.json" -Raw|ConvertFrom-Json -AsHashtable
          Assert-TfCiState $state
          $context="$($env:TOKENFORGE_TENANT_FINGERPRINT)/$($env:TOKENFORGE_PRINCIPAL_FINGERPRINT)/$($state.PlanId)/$($env:INDEX)"
          $checkpoint="$env:RUNNER_TEMP/private/checkpoint.sealed"
          $before=Get-Content "$env:RUNNER_TEMP/result/receipt.json" -Raw|ConvertFrom-Json
          if($before.Status -cne 'Complete'){throw 'Initial validation worker did not complete.'}
          $bytes=Unprotect-TfCiCheckpoint ([IO.File]::ReadAllBytes($checkpoint)) $env:TOKENFORGE_CHECKPOINT_KEY $context
          try{$saved=[Text.Encoding]::UTF8.GetString($bytes)|ConvertFrom-Json;$attempts=$saved.Flows.Attempts.Count;$rows=$saved.Scopes.Observations.Count;$saved=$null}
          finally{[Security.Cryptography.CryptographicOperations]::ZeroMemory($bytes)}
          ./scripts/Invoke-TokenForgeCiDiscovery.ps1 -DataPath "$env:RUNNER_TEMP/anonymous" -WeeklyStatePath "$env:RUNNER_TEMP/plan/state.json" -ChunkIndex ([int]$env:INDEX) -ReceiptPath "$env:RUNNER_TEMP/result/receipt.json" -CheckpointPath $checkpoint -CheckpointInputPath $checkpoint
          $after=Get-Content "$env:RUNNER_TEMP/result/receipt.json" -Raw|ConvertFrom-Json
          foreach($field in @('Status','SchemaVersion','Assessed','Successful','AssessedPairs','SuccessfulPairs')){if($before.$field -cne $after.$field){throw 'Resumed receipt changed completion or counts.'}}
          $bytes=Unprotect-TfCiCheckpoint ([IO.File]::ReadAllBytes($checkpoint)) $env:TOKENFORGE_CHECKPOINT_KEY $context
          try{$saved=[Text.Encoding]::UTF8.GetString($bytes)|ConvertFrom-Json;if($saved.Flows.Attempts.Count -ne $attempts -or $saved.Scopes.Observations.Count -ne $rows){throw 'Encrypted resume repeated completed evidence.'};$saved=$null}
          finally{[Security.Cryptography.CryptographicOperations]::ZeroMemory($bytes)}
          Copy-Item (Join-Path "$env:RUNNER_TEMP/anonymous/scopes" ('chunk-{0:D4}.json' -f [int]$env:INDEX)) "$env:RUNNER_TEMP/result/scopes.json"
          Add-Content $env:GITHUB_STEP_SUMMARY 'Isolated encrypted resume: completed receipt preserved; added flow attempts 0; added scope rows 0.'
      - name: Save encrypted diagnostic checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-${{ matrix.plan }}-${{ matrix.index }}
          path: ${{ runner.temp }}/private/checkpoint.sealed
          overwrite: true
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload public receipt and anonymous scope evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-${{ matrix.index }}
          path: ${{ runner.temp }}/result/*.json
          overwrite: true
          retention-days: 1
          if-no-files-found: ignore
  publish:
    needs: [prepare, worker]
    if: always() && needs.prepare.result == 'success' && (!inputs.validation_only || needs.worker.result == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-data
          path: ${{ runner.temp }}/discovery-data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weekly-plan
          path: ${{ runner.temp }}/plan
      - name: Download any completed worker outputs
        if: needs.prepare.outputs.has_work == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifacts=(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"|ConvertFrom-Json).artifacts
          if($LASTEXITCODE -ne 0){throw 'Worker artifact lookup failed.'}
          foreach($artifact in @($artifacts|Where-Object name -Match '^result-[0-9]+$')){
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifact.name --dir (Join-Path "$env:RUNNER_TEMP/plan" $artifact.name)
            if($LASTEXITCODE -ne 0){throw 'Worker download failed.'}
          }
      - name: Validate receipts and publish one coherent update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.prepare.outputs.mode }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          $ErrorActionPreference='Stop'
          $validation=$env:VALIDATION_ONLY -eq 'true'
          $report=./scripts/Invoke-TokenForgeWeeklyCi.ps1 -Action Publish -DataPath "$env:RUNNER_TEMP/discovery-data" -BundlePath "$env:RUNNER_TEMP/plan" -Mode $env:MODE -ValidationOnly:$validation
          $report
          if($validation){
            if(-not $report.Complete){throw 'Hosted validation did not complete its selected set.'}
            Add-Content $env:GITHUB_STEP_SUMMARY 'Isolated validation only: no catalog branch files were updated.'
            exit 0
          }
      - name: Save isolated aggregate validation report
        if: inputs.validation_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery-data/coverage-deep.json
          retention-days: 8
          overwrite: true
          if-no-files-found: error
      - name: Save validated public data for the branch writer
        if: ${{ !inputs.validation_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-data
          overwrite: true
          path: |
            ${{ runner.temp }}/discovery-data/applications.json
            ${{ runner.temp }}/discovery-data/weekly-*.json
            ${{ runner.temp }}/discovery-data/coverage-*.json
            ${{ runner.temp }}/discovery-data/reports/*.json
            ${{ runner.temp }}/discovery-data/scopes/*.json
          retention-days: 1
          if-no-files-found: error
  push:
    needs: publish
    if: always() && needs.publish.result == 'success' && !inputs.validation_only
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validated-data
          path: ${{ runner.temp }}/discovery-data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: weekly-plan
          path: ${{ runner.temp }}/plan
      - name: Validate public files and advance the frozen data parent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/TokenForgeCiState.ps1
          Import-Module ./src/TokenForge/TokenForge.psd1
          $request=Get-Content "$env:RUNNER_TEMP/plan/request.json" -Raw|ConvertFrom-Json -AsHashtable
          Assert-TfCiKeys $request @('SchemaVersion','PlanId','Mode','Indices','BaseCommit')
          if($request.SchemaVersion -ne 1 -or $request.BaseCommit -notmatch '^[a-f0-9]{40}$' -or $request.PlanId -notmatch '^[a-f0-9]{64}$' -or $request.Mode -cnotin @('Shallow','Deep')){throw 'Only normal publication requests can advance the data branch.'}
          Assert-TfCiPublicData "$env:RUNNER_TEMP/discovery-data"
          $null=Get-TokenForgeApplicationMetadata "$env:RUNNER_TEMP/discovery-data/applications.json" -PublicOnly
          $published=Get-Content (Join-Path "$env:RUNNER_TEMP/discovery-data" ('weekly-'+$request.Mode.ToLowerInvariant()+'.json')) -Raw|ConvertFrom-Json -AsHashtable
          if($published.PlanId -cne $request.PlanId -or $published.Recipe.Mode -cne $request.Mode){throw 'Validated data does not match the publication request.'}
          Set-Location "$env:RUNNER_TEMP/discovery-data"
          git init --quiet
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin discovery-data
          if($LASTEXITCODE -ne 0){throw 'Data branch fetch failed.'}
          $expected=(Get-Content "$env:RUNNER_TEMP/plan/request.json" -Raw|ConvertFrom-Json).BaseCommit
          $actual=git rev-parse FETCH_HEAD
          if($actual -cne $expected){throw 'Data branch advanced; rerun the coordinator before publishing.'}
          # Retain the fetched parent while preserving validated files for this run.
          git reset --mixed FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'Data parent setup failed.'}
          git checkout -b discovery-data
          $stagePaths=@(Get-TfCiPublicStagePaths "$env:RUNNER_TEMP/discovery-data")
          git add -- @stagePaths
          if($LASTEXITCODE -ne 0){throw 'Public staging failed.'}
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){exit 0}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh frozen weekly research coverage and anonymous scope evidence'
          if($LASTEXITCODE -ne 0){throw 'Data commit failed.'}
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:'+$env:GH_TOKEN))
          try{git push origin HEAD:refs/heads/discovery-data;if($LASTEXITCODE -ne 0){throw 'Data push failed.'}}
          finally{$env:GIT_CONFIG_VALUE_0=$null;$env:GIT_CONFIG_COUNT=$null}
