name: PowerShell validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSResourceRepository -PSGallery -ErrorAction Stop
          }
          Install-PSResource Pester -Version 5.7.1 -Repository PSGallery -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
          Import-Module Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
      - name: Validate module and run offline tests
        shell: pwsh
        run: ./scripts/Test-TokenForge.ps1
